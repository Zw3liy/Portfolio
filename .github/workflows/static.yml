# Validate static content on pull requests and deploy main to GitHub Pages
name: Build and deploy static portfolio

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -s index.html
          test -s assets/css/portfolio.css
          test -s assets/js/portfolio.js
          test -s assets/images/datacentre-portrait.jpg
          test -s assets/images/server-maintenance.jpg
          test -s assets/images/network-rack.jpg
          test -s assets/images/fibre-infrastructure.jpg
          test -s assets/images/software-workstation.jpg
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    if: github.event_name == 'push'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
